name: Recipe Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check recipe format and README index
        run: bash scripts/lint-recipes.sh
      - name: Check skills/ is regenerated from the recipes
        run: bash scripts/build-skills.sh --check
